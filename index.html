<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Future Strata — Exhibition Shelters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bedrock:#1b1712;
    --deep-soil:#3d2b1f;
    --umber:#6b4226;
    --clay:#a9714b;
    --ochre:#d9b26f;
    --sand:#f2e4c9;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Inter', sans-serif;
    background:
      linear-gradient(180deg,
        var(--bedrock) 0%,
        var(--deep-soil) 16%,
        var(--umber) 38%,
        var(--clay) 62%,
        var(--ochre) 84%,
        var(--sand) 100%);
    background-attachment:fixed;
    color:var(--sand);
    min-height:100vh;
    padding-bottom:80px;
  }

  .hero{
    padding:100px 24px 70px;
    text-align:center;
    position:relative;
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--ochre);
    margin-bottom:22px;
  }
  h1{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:clamp(38px, 7vw, 76px);
    line-height:1.02;
    letter-spacing:-0.01em;
  }
  h1 em{
    font-style:italic;
    font-weight:300;
    color:var(--ochre);
  }
  .subtitle{
    margin-top:22px;
    font-size:15px;
    color:#e9d9b8cc;
    max-width:480px;
    margin-left:auto;
    margin-right:auto;
    line-height:1.6;
  }
  .strata-mark{
    margin:34px auto 0;
    width:160px;
    height:34px;
    display:flex;
    flex-direction:column;
    gap:3px;
  }
  .strata-mark div{
    height:3px;
    border-radius:2px;
    opacity:0.85;
  }
  .strata-mark div:nth-child(1){background:var(--sand); width:100%;}
  .strata-mark div:nth-child(2){background:var(--ochre); width:78%;}
  .strata-mark div:nth-child(3){background:var(--clay); width:92%;}
  .strata-mark div:nth-child(4){background:var(--umber); width:60%;}
  .strata-mark div:nth-child(5){background:var(--sand); width:85%;}

  .lang-toggle{
    position:fixed;
    top:20px;
    right:20px;
    z-index:50;
    display:flex;
    gap:4px;
    background:rgba(27,23,18,0.55);
    backdrop-filter:blur(6px);
    border:1px solid rgba(242,228,201,0.25);
    border-radius:100px;
    padding:4px;
  }
  .lang-toggle button{
    background:none;
    border:none;
    color:var(--sand);
    font-family:'Inter',sans-serif;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.05em;
    padding:7px 14px;
    border-radius:100px;
    cursor:pointer;
    transition:background 0.2s ease, color 0.2s ease;
  }
  .lang-toggle button.active{
    background:var(--ochre);
    color:var(--bedrock);
  }
  .lang-toggle button:not(.active):hover{background:rgba(242,228,201,0.12);}

  .form-wrap{
    max-width:640px;
    margin:0 auto;
    padding:0 24px;
  }
  .layer{
    background:rgba(27,23,18,0.32);
    border:1px solid rgba(242,228,201,0.16);
    border-radius:18px;
    padding:34px 30px;
    margin-bottom:22px;
    backdrop-filter:blur(3px);
  }
  .layer-label{
    font-size:11px;
    letter-spacing:0.22em;
    text-transform:uppercase;
    color:var(--ochre);
    margin-bottom:14px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .layer-label .rule{
    flex:1;
    height:1px;
    background:rgba(242,228,201,0.25);
  }
  .question{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:22px;
    line-height:1.35;
    margin-bottom:20px;
  }
  .options{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
  }
  .opt{position:relative;}
  .opt input{
    position:absolute;
    opacity:0;
    width:100%;
    height:100%;
    cursor:pointer;
    margin:0;
  }
  .opt label{
    display:block;
    padding:10px 18px;
    border:1px solid rgba(242,228,201,0.3);
    border-radius:100px;
    font-size:14px;
    cursor:pointer;
    transition:all 0.15s ease;
    background:rgba(242,228,201,0.04);
  }
  .opt input:checked + label{
    background:var(--ochre);
    color:var(--bedrock);
    border-color:var(--ochre);
    font-weight:600;
  }
  .opt label:hover{border-color:var(--ochre);}

  textarea{
    width:100%;
    background:rgba(242,228,201,0.06);
    border:1px solid rgba(242,228,201,0.28);
    border-radius:10px;
    padding:14px 16px;
    color:var(--sand);
    font-family:'Inter',sans-serif;
    font-size:15px;
    resize:vertical;
    min-height:52px;
  }
  textarea::placeholder{color:rgba(242,228,201,0.45);}
  textarea:focus{outline:2px solid var(--ochre); outline-offset:1px;}

  .final-line{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-size:22px;
    color:var(--sand);
  }

  .submit-row{
    text-align:center;
    margin-top:36px;
  }
  button.submit{
    background:var(--sand);
    color:var(--bedrock);
    border:none;
    padding:16px 40px;
    border-radius:100px;
    font-family:'Inter',sans-serif;
    font-size:14px;
    font-weight:600;
    letter-spacing:0.04em;
    cursor:pointer;
    transition:transform 0.15s ease, background 0.15s ease;
  }
  button.submit:hover{transform:translateY(-2px); background:var(--ochre);}
  button.submit:disabled{opacity:0.5; cursor:not-allowed; transform:none;}
  button.submit.success{
    background:#4a7c3f;
    color:#f2e4c9;
    opacity:1;
    cursor:default;
  }
  button.submit.success:hover{transform:none; background:#4a7c3f;}

  .status-msg{
    text-align:center;
    margin-top:18px;
    font-size:13px;
    min-height:18px;
  }

  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{transition:none !important;}
  }
</style>
</head>
<body>

<div class="lang-toggle">
  <button id="btnTr" class="active">TR</button>
  <button id="btnEn">EN</button>
</div>

<div class="hero">
  <div class="eyebrow" id="txtEyebrow"></div>
  <h1>Future Strata<br><em>Exhibition Shelters</em></h1>
  <div class="strata-mark"><div></div><div></div><div></div><div></div><div></div></div>
  <p class="subtitle" id="txtSubtitle"></p>
</div>

<form class="form-wrap" id="surveyForm">
  <input type="hidden" name="_subject" id="subjectField">
  <input type="hidden" name="language" id="languageField">
  <input type="hidden" name="timestamp" id="timestampField">

  <div class="layer">
    <div class="layer-label" id="identityLabel"><div class="rule"></div></div>
    <div class="question" id="nameQuestion"></div>
    <input type="text" name="name" id="nameField" required style="width:100%; background:rgba(242,228,201,0.06); border:1px solid rgba(242,228,201,0.28); border-radius:10px; padding:14px 16px; color:var(--sand); font-family:'Inter',sans-serif; font-size:15px; margin-bottom:16px;">
    <div class="question" id="emailQuestion" style="margin-top:16px;"></div>
    <input type="email" name="email" id="emailField" required style="width:100%; background:rgba(242,228,201,0.06); border:1px solid rgba(242,228,201,0.28); border-radius:10px; padding:14px 16px; color:var(--sand); font-family:'Inter',sans-serif; font-size:15px;">
  </div>

  <div id="layersContainer"></div>

  <div class="submit-row">
    <button type="submit" class="submit" id="submitBtn"></button>
    <div class="status-msg" id="statusMsg"></div>
    <div id="analysisRow" style="display:none; margin-top:18px;">
      <button type="button" class="submit" id="analysisBtn" style="background:transparent; border:1px solid var(--sand); color:var(--sand);"></button>
    </div>
  </div>
</form>

<div class="form-wrap" id="analysisPanel" style="display:none; margin-top:10px;">
  <div class="layer" id="analysisContent"></div>
</div>

<script>
const LANG = {
  tr: {
    subject: 'Future Strata — Yeni Yanıt',
    eyebrow: 'Sergi · Katılımcı Anketi',
    subtitle: 'Kişisel Sığınaklar & Aidiyet — 7 soru. Her yanıt, sergiye eklenen yeni bir katman.',
    layer: (n) => `Katman ${String(n).padStart(2,'0')}`,
    submit: 'Yanıtı Gönder',
    submitSuccess: '✓ Gönderildi',
    submitting: 'Gönderiliyor...',
    success: 'Yanıtınız kaydedildi, teşekkürler.',
    required: 'Lütfen tüm seçmeli soruları yanıtlayın.',
    errorPrefix: 'Gönderim başarısız oldu: ',
    unknownError: 'bilinmeyen hata',
    identityLabel: 'Başlarken',
    nameQuestion: 'Adın nedir?',
    emailQuestion: 'E-posta adresin',
    analysisBtn: 'Sığınak Analizini Gör',
    analysisLoading: 'Analiz oluşturuluyor...',
    analysisError: 'Analiz oluşturulamadı, lütfen tekrar deneyin.',
    analysisEmailNote: 'Analiz aynı zamanda e-posta adresine de gönderildi.',
    questions: [
      { key:'q1', type:'radio', question:'En güvende hissettiğin yer neresi?',
        options:['Ev','Bir insanın yanı','Doğa','Çalışmak / üretmek','Bir topluluk','Hiçbiri'] },
      { key:'q2', type:'radio', question:'Zor bir dönemden geçerken ilk neye yönelirsin?',
        options:['İnsanlara','Çalışmaya','Sanat / üretmeye','Dijital dünyaya','Alışverişe','Uykuya','Doğaya','Sessizliğe'] },
      { key:'q3', type:'text', question:'Şehri terk etmek zorunda kalsan, yanında tek bir şey götürebilsen neyi götürürdün?',
        placeholder:'Açık uçlu yanıtınız...' },
      { key:'q4', type:'text', question:'"Ev" kelimesi sende ilk olarak ne çağrıştırıyor?',
        placeholder:'Açık uçlu yanıtınız...' },
      { key:'q5', type:'radio', question:'Son bir yılda en çok neye ait hissettin?',
        options:['Bir insana / insanlara','Bir mekâna','İşine','Bir fikre','Bir topluluğa','Bir hayvana','Hiçbirine'] },
      { key:'q6', type:'radio', question:'Kendini korumak için en sık hangi yönteme başvurursun?',
        options:['Mesafe koyarım','Daha çok çalışırım','Mizah yaparım','Üretirim','Kaçarım / uzaklaşırım','Kontrol etmeye çalışırım','Yardım isterim'] },
      { key:'q7', type:'text', final:true, question:'"Benim sığınağım…"',
        placeholder:'Cümleyi tamamlayın...' }
    ]
  },
  en: {
    subject: 'Future Strata — New Response',
    eyebrow: 'Exhibition · Participant Survey',
    subtitle: 'Personal Shelters & Belonging — 7 questions. Each response is a new layer added to the exhibition.',
    layer: (n) => `Layer ${String(n).padStart(2,'0')}`,
    submit: 'Submit Response',
    submitSuccess: '✓ Submitted',
    submitting: 'Submitting...',
    success: 'Your response has been saved, thank you.',
    required: 'Please answer all multiple-choice questions.',
    errorPrefix: 'Submission failed: ',
    unknownError: 'unknown error',
    identityLabel: 'Before we begin',
    nameQuestion: 'What\'s your name?',
    emailQuestion: 'Your email address',
    analysisBtn: 'See Shelter Analysis',
    analysisLoading: 'Generating analysis...',
    analysisError: 'Could not generate analysis, please try again.',
    analysisEmailNote: 'The analysis was also sent to your email.',
    questions: [
      { key:'q1', type:'radio', question:'Where do you feel safest?',
        options:['Home','Beside another person','Nature','Working / creating','A community','None of these'] },
      { key:'q2', type:'radio', question:'Going through a hard time, what do you turn to first?',
        options:['People','Work','Art / making','The digital world','Shopping','Sleep','Nature','Silence'] },
      { key:'q3', type:'text', question:'If you had to leave the city and could take only one thing with you, what would it be?',
        placeholder:'Your answer...' },
      { key:'q4', type:'text', question:'What\'s the first thing the word "home" brings to mind?',
        placeholder:'Your answer...' },
      { key:'q5', type:'radio', question:'In the past year, what did you feel you belonged to most?',
        options:['A person / people','A place','Your work','An idea','A community','An animal','None of these'] },
      { key:'q6', type:'radio', question:'What\'s your most common way of protecting yourself?',
        options:['I create distance','I work harder','I use humor','I create / make things','I flee / withdraw','I try to control things','I ask for help'] },
      { key:'q7', type:'text', final:true, question:'"My shelter is…"',
        placeholder:'Complete the sentence...' }
    ]
  }
};

let currentLang = 'tr';

const btnTr = document.getElementById('btnTr');
const btnEn = document.getElementById('btnEn');
const txtEyebrow = document.getElementById('txtEyebrow');
const txtSubtitle = document.getElementById('txtSubtitle');
const layersContainer = document.getElementById('layersContainer');
const submitBtn = document.getElementById('submitBtn');
const statusMsg = document.getElementById('statusMsg');
const subjectField = document.getElementById('subjectField');
const languageField = document.getElementById('languageField');
const form = document.getElementById('surveyForm');
const identityLabel = document.getElementById('identityLabel');
const nameQuestion = document.getElementById('nameQuestion');
const emailQuestion = document.getElementById('emailQuestion');
const nameField = document.getElementById('nameField');
const emailField = document.getElementById('emailField');
const analysisRow = document.getElementById('analysisRow');
const analysisBtn = document.getElementById('analysisBtn');
const analysisPanel = document.getElementById('analysisPanel');
const analysisContent = document.getElementById('analysisContent');

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function render(lang) {
  currentLang = lang;
  const t = LANG[lang];
  document.documentElement.lang = lang;
  btnTr.classList.toggle('active', lang === 'tr');
  btnEn.classList.toggle('active', lang === 'en');
  txtEyebrow.textContent = t.eyebrow;
  txtSubtitle.textContent = t.subtitle;
  subjectField.value = t.subject;
  languageField.value = lang;
  submitBtn.textContent = t.submit;
  submitBtn.classList.remove('success');
  submitBtn.disabled = false;
  statusMsg.textContent = '';
  identityLabel.innerHTML = `${escapeHtml(t.identityLabel)}<div class="rule"></div>`;
  nameQuestion.textContent = t.nameQuestion;
  emailQuestion.textContent = t.emailQuestion;
  analysisBtn.textContent = t.analysisBtn;
  analysisRow.style.display = 'none';
  analysisPanel.style.display = 'none';
  analysisBtn.disabled = false;


  layersContainer.innerHTML = t.questions.map((q, i) => {
    const label = t.layer(i + 1);
    if (q.type === 'radio') {
      const opts = q.options.map((opt, oi) => {
        const id = `${q.key}-${oi}`;
        return `<div class="opt"><input type="radio" name="${q.key}" id="${id}" value="${escapeHtml(opt)}"><label for="${id}">${escapeHtml(opt)}</label></div>`;
      }).join('');
      return `<div class="layer"><div class="layer-label">${label}<div class="rule"></div></div><div class="question">${escapeHtml(q.question)}</div><div class="options">${opts}</div></div>`;
    } else {
      const questionClass = q.final ? 'question final-line' : 'question';
      return `<div class="layer"><div class="layer-label">${label}<div class="rule"></div></div><div class="${questionClass}">${escapeHtml(q.question)}</div><textarea name="${q.key}" id="${q.key}" placeholder="${escapeHtml(q.placeholder)}" rows="2"></textarea></div>`;
    }
  }).join('');
}

btnTr.addEventListener('click', () => render('tr'));
btnEn.addEventListener('click', () => render('en'));

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const t = LANG[currentLang];

  const requiredRadioQuestions = t.questions.filter(q => q.type === 'radio').map(q => q.key);
  for (const key of requiredRadioQuestions) {
    if (!form.querySelector(`input[name="${key}"]:checked`)) {
      statusMsg.style.color = '#7a2e1e';
      statusMsg.textContent = t.required;
      return;
    }
  }

  submitBtn.disabled = true;
  statusMsg.style.color = '#3d2b1f';
  statusMsg.textContent = t.submitting;

  const formData = new FormData(form);
  formData.set('timestamp', new Date().toISOString());

  try {
    const response = await fetch("https://formspree.io/f/xwlelrnk", {
      method: "POST",
      headers: { "Accept": "application/json" },
      body: formData
    });
    if (!response.ok) throw new Error(`Formspree request failed: ${response.status}`);

    submitBtn.classList.add('success');
    submitBtn.textContent = t.submitSuccess;
    statusMsg.style.color = '#3d6b2e';
    statusMsg.textContent = t.success;
    analysisRow.style.display = 'block';
  } catch (err) {
    console.error('Submission error:', err);
    statusMsg.style.color = '#7a2e1e';
    statusMsg.textContent = t.errorPrefix + (err && err.message ? err.message : t.unknownError);
    submitBtn.disabled = false;
  }
});

analysisBtn.addEventListener('click', async () => {
  const t = LANG[currentLang];
  analysisBtn.disabled = true;
  analysisBtn.textContent = t.analysisLoading;
  analysisPanel.style.display = 'block';
  analysisContent.innerHTML = `<div class="question">${escapeHtml(t.analysisLoading)}</div>`;

  const answers = {};
  LANG[currentLang].questions.forEach(q => {
    if (q.type === 'radio') {
      const checked = form.querySelector(`input[name="${q.key}"]:checked`);
      answers[q.key] = { question: q.question, answer: checked ? checked.value : '' };
    } else {
      answers[q.key] = { question: q.question, answer: form.querySelector(`#${q.key}`).value.trim() };
    }
  });

  const payload = {
    name: nameField.value.trim(),
    email: emailField.value.trim(),
    lang: currentLang,
    answers
  };

  try {
    const res = await fetch('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if (!res.ok) throw new Error(`Analysis request failed: ${res.status}`);
    const data = await res.json();

    analysisContent.innerHTML = `
      <div class="question" style="margin-bottom:14px;">${escapeHtml(data.title || '')}</div>
      <div style="white-space:pre-wrap; line-height:1.6; font-size:15px;">${escapeHtml(data.body || '')}</div>
      <div style="margin-top:20px; font-size:12px; color:rgba(242,228,201,0.6);">${escapeHtml(t.analysisEmailNote)}</div>
    `;
    analysisBtn.style.display = 'none';
  } catch (err) {
    console.error('Analysis error:', err);
    analysisContent.innerHTML = `<div class="question">${escapeHtml(t.analysisError)}</div>`;
    analysisBtn.disabled = false;
    analysisBtn.textContent = t.analysisBtn;
  }
});

render('tr');
</script>

</body>
</html>
